<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#F7F6F2">
  <link rel="icon" type="image/png" href="{{ '/assets/avatar.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="MyTeam.md home">
      <img src="{{ '/assets/avatar.png' | relative_url }}" alt="" width="44" height="44">
      <span translate="no">MyTeam<span class="suffix">.md</span></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ '/guides/setup.html' | relative_url }}"{% if page.url == '/guides/setup.html' %} aria-current="page"{% endif %}>Setup guide</a>
      <a href="{{ '/guides/setup-test.html' | relative_url }}"{% if page.url == '/guides/setup-test.html' %} aria-current="page"{% endif %}>Test the preview</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap">
    <p><strong translate="no">MyTeam.md</strong><br>Your team. On the same page.</p>
    <p class="footer-note">Private development preview. No published alpha or npm package.<br>
      <a href="https://github.com/saleemhamo/myteam-md">Source repository (access required)</a>
    </p>
  </footer>
</body>
</html>
