---
layout: default
---
<div class="docs-layout wrap">
  <aside class="docs-nav">
    <p class="eyebrow">The preview</p>
    <nav aria-label="Documentation">
      <a href="{{ '/' | relative_url }}">Overview</a>
      {% assign guides = site.pages | where: "layout", "guide" | sort: "nav_order" %}
      {% for guide in guides %}
      <a href="{{ guide.url | relative_url }}"{% if page.url == guide.url %} aria-current="page"{% endif %}>{{ guide.title | escape }}</a>
      {% endfor %}
    </nav>
    <p class="docs-note">Local configuration today.<br>Board and live agent connections are still planned.</p>
  </aside>
  <article class="prose">{{ content }}</article>
</div>
